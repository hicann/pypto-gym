[pytest]
# 测试文件匹配规则：pypto 各模型既有 test_*.py 也有 glm_*.py / deepseekv32_*.py / qwen3_next_*.py 等直接内含 test_* 函数的脚本
python_files = test_*.py glm_*.py deepseekv32_*.py qwen3_next_*.py

# 默认测试路径：算子库本体目录 + tests 目录
testpaths = src/pypto_gym/models tests

markers =
    soc: Mark test cases for specific SOC versions (e.g., 950, 910)
    world_size: number of NPU cards required (e.g., 1, 2)

# 排除 experimental 目录（与 pypto 源仓保持一致，需显式指定才运行实验性算子）
norecursedirs = experimental
