[pytest]
# 测试文件匹配规则：所有测试位于 tests/ops/ 下，统一以 test_*.py 命名
python_files = test_*.py

# 默认测试路径：benchmark 自测 + 算子库本体 + tests/ops（与 upstream 一致）
testpaths = tests/ops tests/st

markers =
    soc: Mark test cases for specific SOC versions (e.g., 950, 910)
    world_size: number of NPU cards required (e.g., 1, 2)

# 排除 experimental 目录（与 pypto 源仓保持一致，需显式指定才运行实验性算子）
norecursedirs = experimental

addopts =
    --ignore=tests/ops/glm_v4_5/test_glm_attention_fusion.py
    --ignore=tests/ops/spatial_ssrl_3b/rope/test_rope.py
    --ignore=tests/ops/deepseek_v2_lite_chat/test_mla_prolog.py
    --ignore=tests/ops/qat/test_qat.py
    --ignore=tests/ops/llada2_moe/test_llada2_gate_select.py
    --ignore=tests/ops/phi_3_mini_4k_instruct/test_rms_norm_phi_3_mini_4k_instruct.py
    --ignore=tests/ops/gutenocr_3b/test_rms_norm_gutenocr_3b.py
    --ignore=tests/ops/arctic/test_sum_lstm.py
    --ignore=tests/ops/glm_v4_5/test_glm_attention.py
    --ignore=tests/ops/glm_v4_5/test_glm_ffn_shared_expert_quant.py
    --ignore=tests/ops/spatial_ssrl_3b/rms_norm/test_rms_norm_spatial_ssrl_3b.py
    --ignore=tests/ops/qwen3_6_27b/test_gated_delta_rule_qwen3_6_27b.py
    --ignore=tests/ops/glm_v4_5/test_glm_attention_pre_quant.py
    --ignore=tests/ops/minimax_m27/test_minimax_m27_grouped_gemm.py
    --ignore=tests/ops/chunked_gdr/test_chunked_gated_delta_rule.py
    --ignore=tests/ops/deepseek_v32_exp/test_sparse_flash_attention_quant.py
