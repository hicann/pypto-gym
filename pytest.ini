[pytest]
# 测试文件匹配规则：所有测试位于 tests/ops/ 下，统一以 test_*.py 命名
python_files = test_*.py

# 默认测试路径：benchmark 自测 + 算子库本体 + tests/ops（与 upstream 一致）
testpaths = tests/ops tests/st

markers =
    soc: Mark test cases for specific SOC versions (e.g., 950, 910)
    world_size: number of NPU cards required (e.g., 1, 2)

# 排除 experimental 目录（与 pypto 源仓保持一致，需显式指定才运行实验性算子）
norecursedirs = experimental

addopts =
    ; --ignore=tests/ops/experimental/matmul/grouped_matmul_swiglu_quant/test_gmm_swiglu_quant.py
    ; --ignore=tests/ops/experimental/ops_transformer/fused_swiglu_grad/test_fused_swiglu_grad.py
    ; --ignore=tests/ops/experimental/attention/test_prompt_flash_attention.py
    ; --ignore=tests/ops/experimental/matmul/grouped_matmul_finalize_routing/test_gmm_finalize_routing.py
    ; --ignore=tests/ops/experimental/attention/incre_flash_attention_mla/test_incre_flash_attention_mla.py
    ; --ignore=tests/ops/experimental/vector/QkvRmsNormRopeCache/test_qkv_rms_norm_rope_cache.py
    ; --ignore=tests/ops/experimental/vector/InterleaveRope/test_interleave_rope.py
    ; --ignore=tests/ops/experimental/vector/InplaceAddRmsNorm/test_inplace_add_rms_norm.py
    ; --ignore=tests/ops/experimental/ops_transformer/flash_attention_mha/test_flash_attention_mha.py
    ; --ignore=tests/ops/experimental/ops_transformer/flash_attention_score_grad/test_flash_attention_score_grad.py
    --ignore=tests/ops/glm_v4_5/test_glm_attention_fusion.py
    --ignore=tests/ops/qat/test_qat.py
