[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascriptor"
version = "0.1.0"
description = "ascriptor ascribes every Python statement to exactly one Ascend instruction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CANN-2.0" }
authors = [{ name = "ddddwe" }]
keywords = ["ascend", "npu", "dsl", "cce", "ascendc", "kernel", "ir"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Compilers",
]
# The core (IR, frontend, passes, cce/pto_isa emitters) has no third-party dependency.
dependencies = []

[project.optional-dependencies]
# The simulator backend executes kernels on host tensors.
sim = ["torch>=2.9.1", "numpy"]
# OpExec / torch bindings for the launchers.
torch = ["torch>=2.9.1", "numpy"]
# PyPTO Pro itself ships with CANN and is not on PyPI; this extra only pins host-side helpers.
pypto_pro = []
all = ["torch>=2.9.1", "numpy"]
dev = ["pytest>=7", "pytest-xdist>=3", "hypothesis>=6", "ruff>=0.4"]

[project.scripts]
ascriptor = "ascriptor.cli:main"

# Backends are discovered through this entry-point group (RFC-0001 §11). The built-in
# backends register here once they exist (sim: M4, cce: M5, pto_isa: M6, pypto_pro: M7);
# a third-party backend registers the same way from its own package.
[project.entry-points."ascriptor.backends"]
cce = "ascriptor.backends.cce:CceBackend"
pypto_pro = "ascriptor.backends.pypto_pro:PyptoProBackend"
pto_isa = "ascriptor.backends.pto_isa:PtoIsaBackend"

[tool.setuptools.packages.find]
include = ["ascriptor*"]

[tool.setuptools.package-data]
ascriptor = ["*.pyi", "frontend/*.pyi", "dtypes/*.pyi", "devices/profiles/*.json", "importers/pypto_pro/*.json", "backends/*/include/*.h", "backends/sim/timing/*.json", "runtime/aclnn/template/**/*", "runtime/aclnn/template/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Generated compiler and model checks use one process by default. A coordinated operator may
# raise xdist concurrency after budgeting the memory needed by the selected reference cases.
addopts = "-q -n 0 --durations=15"

[tool.ruff]
line-length = 110
target-version = "py310"
# The synchronized privacy utility and vendor project template retain their own formatting.
extend-exclude = ["ascriptor/runtime/aclnn/template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# kernels are written against a device facade: `from ascriptor.a5 import *` is the DSL surface
"tests/kernels/**" = ["F403", "F405"]
