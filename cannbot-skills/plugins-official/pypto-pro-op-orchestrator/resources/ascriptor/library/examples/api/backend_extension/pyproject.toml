[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascriptor-teaching-backend"
version = "0.1.0"
description = "Minimal public ascriptor backend protocol example"
requires-python = ">=3.10"
dependencies = []  # this example resolves Ascriptor from the source snapshot

[project.entry-points."ascriptor.backends"]
teaching_cce = "backend_plugin:TeachingCceBackend"

[tool.setuptools]
py-modules = ["backend_plugin"]
