[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# A GM shape symbol is a string inside a type subscript -- `api.GM[api.f16, ("rows", DIM)]`
# declares a dimension named `rows`, which the frontend binds from the kernel's own `rows`
# parameter. Ruff reads any string in an annotation as a forward reference to a type, so it
# reports F821 for a name that is not one. Only these two kernels name a dimension that is not
# also a module constant; everywhere else the check stays on.
"ascriptor_kernels/tutorials/late_reader/kernel.py" = ["F821"]
"ascriptor_kernels/tutorials/mixed_pipeline/kernel.py" = ["F821"]
