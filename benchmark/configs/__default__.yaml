# pypto KernelBench 批处理默认配置
# 普通 YAML 会递归覆盖这里的默认值, 因此只需要写差异字段.

# 仅解析配置并退出, 用于 CLI contract/smoke 验证.
dry_run: false

# Python logging 级别: DEBUG / INFO / WARN / WARNING / ERROR.
log_level: "INFO"

# --- 数据集 (内置完整 KernelBench case 集) ---
# bench_dir 指包含 KernelBench level 子目录的根目录.
# 留空则 CLI 自动使用 benchmark/KernelBench/.
bench_dir: ""

# case selector, 必须写明 level, 支持完整 stem、序号和闭区间:
#   "level1=19_ReLU"
#   "level1=1:40"
#   "level1=;level2=;level3=;level4=;pto_case="
# 使用 "level1=" 可选择该 level 下全部 case.
cases: "level1=19_ReLU"

# 使用 "level1=" 选择整个 level 时截取前 N 个用例; null 表示不截断.
limit: null

# --- 设备 ---
# 用于 pypto 生成 + KernelVerifier 验证的 NPU 卡列表.
# 单卡 sequential 时填 [0] 即可.
devices: [0]

# --- 并发 ---
# 同时跑的 case 数, 上限不应超过 len(devices).
concurrency: 1

# --- 设备调度 ---
# normal — 使用上方 devices / concurrency 静态轮询分配（默认）.
# pool   — asyncio 设备池：prepare / pypto / verifier 分阶段 acquire-release；
#          case_loader 探针禁止 find-free；启动前对各卡做 softmax quick test 预检（fail-fast）.
device_mode: normal

# --- 输出根目录 ---
# root_dir 非空时直接作为本次运行根目录:
#   <root_dir>/{logs,report,state}/...
# root_dir 为空时, 每次运行创建:
#   <base_dir>/Task_<random>/{logs,report,state}/...
output:
  root_dir: ""
  base_dir: "benchmark_runs"

# --- pypto 工作流 ---
pypto:
  # pypto 源码仓根; 留空时使用 benchmark/.cache/pypto.
  # 初始化/更新: bash benchmark/scripts/download_pypto.sh
  repo_root: ""
  # opencode CLI 可执行路径; 留空则按 PATH 查找.
  opencode_bin: ""
  # 显式传给 opencode run -m 的模型名; 留空则沿用 opencode 当前默认配置.
  opencode_model: ""
  # 调用的 agent 名 (须在 pypto/.opencode/agents/ 下注册).
  agent: "pypto-op-orchestrator"
  # 单 case 工作流超时, 秒. 7 阶段实跑可能很慢; 单纯 correctness 实验可显式调小.
  timeout_sec: 7200
  # 写入 opencode initial prompt 的 Stage 7 性能优化轮次上限.
  pref_round: 3
  # 跳过 pypto 生成, 仅复跑 verifier; 要求 custom/<op>/ 产物已就绪.
  skip_pypto_gen: false
  # 即使产物齐全也强制重跑 pypto 生成.
  force_regen: false
  # 状态机未完成且无 failed/blocked/cancelled 阶段时, 自动重跑 PyPTO workflow 的次数.
  # OpenCode 非 timeout 异常退出会直接消耗一次 retry.
  # 默认 1 表示最多两次尝试: 初次运行 + 1 次 retry.
  incomplete_workflow_retry: 1
  # 除 OpenCode 非 timeout 异常退出外, 仅当 session tree 的 last update 到
  # PyPTO finished 空窗达到该秒数时, 才消耗上面的 incomplete retry.
  # 这避免正常长任务被无意义重试.
  incomplete_workflow_retry_min_gap_sec: 1800
  # 算子产物落地的根目录 (相对 pypto 仓根); 形成 custom/{op}/.
  workdir_root: "custom"
  # opencode --format; default 输出可读, json 输出结构化事件流.
  output_format: "default"

# --- 验证 ---
verifier:
  # 框架: torch (内置 verifier 仅支持 torch).
  framework: "torch"
  # 后端: ascend / cuda / cpu.
  backend: "ascend"
  # 单次 verify 子进程超时, 秒. 默认 15 分钟.
  verify_timeout: 900
  # verify 精度比较容差; 留空则走代码默认值 1e-3 / 1e-3.
  # verify_rtol: 1.0e-3
  # verify_atol: 1.0e-3
  # 验证范围:
  #   correctness  — 仅精度
  #   performance  — 精度 + 性能 (gen vs base speedup)
  #   full         — 当前等价于 performance
  mode: "performance"
  # 执行模式 (谁来跑反作弊+精度+性能):
  #   opencode — spawn `opencode run --agent pypto-kernel-validator` 加载
  #              `.agents/skills/pypto-kernel-validate`, agent 在 skill
  #              引导下做"脚本机械检测 + LLM 语义审阅 + 精度 + 性能",
  #              落 skill_report.json. 这是默认 + 对外贡献候选物.
  #   direct   — 直调内置 KernelVerifier, 跳过 LLM 语义层 (无反作弊审阅).
  #              仅用于 CI / 离线 dev 调试, 节省 LLM 调用成本.
  verifier_mode: "opencode"
  # opencode 模式 — agent 名 (须在 .opencode/agents/ 下注册).
  validator_agent: "pypto-kernel-validator"
  # opencode 模式 — skill agent 子进程硬超时, 秒.
  skill_timeout_sec: 1800
  # opencode/API 层超时后的重试次数; 业务验证失败不重试.
  skill_retry: 2
  # opencode/API 层超时重试间隔, 秒.
  skill_retry_interval_sec: 600
  # 是否保留 KernelVerifier verify/profile 临时工作目录.
  # 默认 false: 子进程日志已进入报告/JSON 摘要后清理脚本和源码副本.
  # 调试 verify/profile 脚本时可设为 true.
  keep_artifacts: false

# --- Monitor state ---
monitor:
  # state.json 刷新间隔, 秒.
  poll_sec: 3
