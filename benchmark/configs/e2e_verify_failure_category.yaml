# 端到端 smoke：在无 NPU / OpenCode 环境下跑真实 KernelBench case，验证
# summary.json / summary.md 的 failure_category 列与总览统计。
# 用法（仓库根目录，PYTHONPATH 含当前目录）:
#   PYTHONPATH=. python -m benchmark run --config configs/e2e_verify_failure_category.yaml
cases: "level1=19_ReLU"
verifier:
  backend: cpu
  verifier_mode: direct
pypto:
  skip_pypto_gen: true
