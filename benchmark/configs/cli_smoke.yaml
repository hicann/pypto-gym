# Lightweight config used to validate the unified CLI contract without NPU,
# KernelBench data, or opencode.
dry_run: true
log_level: "INFO"
bench_dir: ""
cases: "level1=19_ReLU"
limit: null
devices: [0]
concurrency: 1

output:
  root_dir: ""
  base_dir: "benchmark_runs"

pypto:
  # Minimal tree for _validate_pypto_repo_root (benchmark/tests/fixtures/...); avoids dry_run coupling to ~/.cache/pypto downloads.
  repo_root: "benchmark/tests/fixtures/minimal_pypto_stub"
  opencode_bin: ""
  opencode_model: ""
  agent: "pypto-op-orchestrator"
  timeout_sec: 7200
  skip_pypto_gen: false
  force_regen: false
  incomplete_workflow_retry: 1
  workdir_root: "custom"
  output_format: "default"

verifier:
  framework: "torch"
  backend: "ascend"
  verify_timeout: 900
  mode: "correctness"
  verifier_mode: "opencode"
  validator_agent: "pypto-kernel-validator"
  skill_timeout_sec: 1800
  skill_retry: 2
  skill_retry_interval_sec: 600
  keep_artifacts: false

monitor:
  poll_sec: 3
