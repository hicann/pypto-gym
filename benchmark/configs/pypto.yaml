# 未填写字段会从 __default__.yaml 继承.
#
# case selector, 必须写明 level, 支持完整 stem、序号和闭区间:
#   "level1=19_ReLU"
#   "level1=1:21,31,41:50"
#   "level1=1:21;level2=31,41:50"
# 使用 "level1=" 可选择该 level 下全部 case.
cases: "level1=1,3,10,18,19,24,26,33,35,36,47,51,89,94,95;level2=9,14,29,30,37,51,56,62,64,68,70,88,94,95,99;level3=43,46,50"

# --- 设备 ---
# 用于 pypto 生成 + KernelVerifier 验证的 NPU 卡列表.
# 单卡 sequential 时填 [0] 即可.
devices: [7]

# --- 并发 ---
# 同时跑的 case 数, 上限不应超过 len(devices).
concurrency: 5

# --- pypto 工作流 ---
pypto:
  # 显式传给 opencode run -m 的模型名; 留空则沿用 opencode 当前默认配置.
  opencode_model: ""
  # 调用的 agent 名 (须在 pypto/.opencode/agents/ 下注册).
  agent: "pypto-op-orchestrator"
  # 单 case 工作流超时, 秒. 7 阶段实跑可能很慢, 默认 120 min 覆盖 Stage 7
  # 性能调优 10 轮迭代; 单纯 correctness 实验可显式调小.
  timeout_sec: 10800
  # 算子产物落地的根目录 (相对 pypto 仓根); 形成 custom/{op}/.
  workdir_root: "custom"
  # opencode --format; default 输出可读, json 输出结构化事件流.
  output_format: "default"

# --- Monitor state ---
monitor:
  # state.json 刷新间隔, 秒.
  poll_sec: 3
